[options]
HoldPkg           = pacman glibc
Architecture      = auto
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 4
DownloadUser      = alpm
CheckSpace
Color

[zfs-linux]
Server = http://kernels.archzfs.com/$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[archzfs]
Server = https://archzfs.com/$repo/$arch
